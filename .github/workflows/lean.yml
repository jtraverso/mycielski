name: Lean verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: "true"
          build-args: "--wfail"
      - name: Compile the independent statements
        run: lake build Challenge
      - name: Audit theorem axioms and boundary cases
        run: lake env lean Audit.lean
