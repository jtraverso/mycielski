name = "mycielski"
version = "0.1.0"
defaultTargets = ["Mycielski", "Solution"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "Mycielski"

[[lean_lib]]
name = "Solution"

[[lean_lib]]
name = "Challenge"
